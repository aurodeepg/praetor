[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praetor"
version = "0.0.1"
description = "An intelligent gateway that issues scoped, revocable authority (warrants) to AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aurodeep Ghosh" }]
keywords = [
  "ai-agents", "authorization", "agent-identity", "zero-trust",
  "delegation", "multi-agent", "gateway", "mcp",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# Core stays dependency-light on purpose. Heavier/optional pieces live in extras.
# pydantic models the warrant — the atomic unit reused by every later milestone.
# pyjwt + cryptography give verifiable agent identity (RS256-signed warrant tokens)
# without rolling our own crypto.
dependencies = [
  "pydantic>=2",
  "pyjwt>=2.8",
  "cryptography>=42",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
# The HTTP gateway + Web UI. Optional so the core install stays light.
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
# Govern a remote agent over HTTP (the HTTPAdapter). Imported lazily.
http = [
  "httpx>=0.27",
]
# Govern any Model Context Protocol server (the MCPAdapter). Imported lazily.
mcp = [
  "mcp>=1.0",
]
# Govern hosted-LLM agents (ChatGPT / Gemini / Claude / Copilot Studio). Provider APIs
# are spoken as plain REST — no vendor SDKs — so only an HTTP client is needed.
llm = [
  "httpx>=0.27",
]
# Semantic capability-matcher backends (embeddings + generation) over HTTP. The actual
# models run in Ollama or any OpenAI-compatible endpoint — only the HTTP client is needed.
semantic = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",   # starlette TestClient transport + HTTPAdapter tests
  "mcp>=1.0",      # validates the MCPAdapter translation against the real SDK types
]

[project.scripts]
praetor = "praetor.cli:main"

[project.urls]
Homepage = "https://github.com/aurodeepg/praetor"
Repository = "https://github.com/aurodeepg/praetor"

[tool.hatch.build.targets.wheel]
packages = ["src/praetor"]

# Ship the static Web UI inside the wheel (editable installs resolve to source).
[tool.hatch.build.targets.wheel.force-include]
"src/praetor/web/static" = "praetor/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
